# Draftroom in production: Caddy in front, the server behind it, PostgreSQL 17 behind that.
#
#   cp deploy/env.example deploy/.env      # then fill in the host name and the two secrets (they are empty until you do)
#   docker compose --env-file deploy/.env -f deploy/docker-compose.prod.yml -p draftroom-prod up -d --build --wait
#
# Only the proxy publishes ports. The server and the database are reachable on the Compose network and nowhere else, so
# the database is never exposed to the host's network. docs/deploy/README.md covers the rest: variables, backups, scaling.
# A project of its own: the development Compose file is `draftroom`, and two projects of one name share the `postgres`
# service and its volume, so this stack would start on the development database.
name: draftroom-prod

services:
  postgres:
    # The image of the development Compose file, pinned by version and by digest of the multi-architecture index.
    image: postgres:17.11@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-draftroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-draftroom}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  server:
    build:
      context: ..
      dockerfile: Dockerfile
      target: server
    image: draftroom-server:${DRAFTROOM_VERSION:-local}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-draftroom}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-draftroom}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in deploy/.env}
      ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in deploy/.env}
      # The proxy is the only thing on this network that talks to the server for the outside world, so its address (anywhere in
      # the subnet fixed below) is the one `X-Forwarded-For` is believed from: the limits on requests and on sign-in then count
      # the person and not the proxy (ADR 0017). It has to be the subnet of `networks.default` below.
      TRUST_PROXY: 172.28.213.0/24
    depends_on:
      postgres:
        condition: service_healthy
    # The server stores the documents it holds when it is told to stop, which can take longer than Compose's default.
    stop_grace_period: 30s
    # Nothing writes to the image: a compromised process cannot persist anything in it, nor gain privileges.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  proxy:
    build:
      context: ..
      dockerfile: Dockerfile
      target: proxy
    image: draftroom-proxy:${DRAFTROOM_VERSION:-local}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in deploy/.env}
      # Where the redirect from HTTP sends people, with the port when HTTPS is not on 443.
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in deploy/.env}
    # Root inside the container, because Caddy binds ports 80 and 443; it keeps that one capability and nothing else.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      # The certificates Caddy obtained or issued: losing them makes it ask for new ones at every start.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      # Caddy's admin endpoint answers on the loopback of the container only.
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1:2019/config/']
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

networks:
  default:
    ipam:
      config:
        # Fixed, so that the server can say which address it trusts (`TRUST_PROXY` above): Compose would otherwise pick a subnet
        # at the first start, and the choice could change. Private space that Docker's own default networks do not use; change
        # it in both places if it collides with a network of the host.
        - subnet: 172.28.213.0/24

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
