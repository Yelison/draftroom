# PostgreSQL for local development: `docker compose up -d --wait postgres`.
# Parallel checkouts give each task its own project and port: `docker compose -p draftroom-<task> ...` with POSTGRES_PORT.
# The credentials are for development only. Nothing here is meant to run anywhere that others can reach.
name: draftroom

services:
  postgres:
    # Pinned by version and by digest of the multi-architecture index, so every machine and the tests run the same build.
    image: postgres:17.11@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-draftroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-draftroom}
      POSTGRES_DB: ${POSTGRES_DB:-draftroom}
    ports:
      # Loopback only: the development database is not served to the network.
      - '127.0.0.1:${POSTGRES_PORT:-5460}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  postgres-data:
