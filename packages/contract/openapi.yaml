components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: dr_session
      description: The server-side session, set at sign-in or sign-up. HttpOnly.
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Echo of the `dr_csrf` cookie (double submit). Required on every method that changes state.
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    FolderId:
      name: folderId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ThreadId:
      name: threadId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    CommentId:
      name: commentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    VersionId:
      name: versionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    UserId:
      name: userId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    Cursor:
      name: cursor
      in: query
      required: false
      description: Where the previous page ended.
      schema:
        $ref: '#/components/schemas/Cursor'
    Limit:
      name: limit
      in: query
      required: false
      description: The most items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  schemas:
    Id:
      type: string
      format: uuid
    NullableId:
      type:
        - string
        - 'null'
      format: uuid
    Timestamp:
      type: string
      format: date-time
    NullableTimestamp:
      type:
        - string
        - 'null'
      format: date-time
    Email:
      type: string
      format: email
      maxLength: 254
    PersonName:
      type: string
      minLength: 1
      maxLength: 80
    Password:
      type: string
      minLength: 12
      maxLength: 128
    WorkspaceName:
      type: string
      minLength: 1
      maxLength: 80
    FolderName:
      type: string
      minLength: 1
      maxLength: 80
    DocumentTitle:
      type: string
      minLength: 1
      maxLength: 200
    CommentBody:
      type: string
      minLength: 1
      maxLength: 5000
    Quote:
      type: string
      minLength: 1
      maxLength: 500
      description: The selected text the thread was anchored to, kept so an orphaned thread still shows what it was about.
    VersionLabel:
      type: string
      minLength: 1
      maxLength: 100
    Revision:
      type: integer
      minimum: 1
      description: Starts at 1 and grows by one with every change to the resource's metadata.
    Cursor:
      type: string
      minLength: 1
      maxLength: 512
      pattern: ^[A-Za-z0-9_-]+$
      description: 'Opaque. Clients pass back exactly what `nextCursor` returned. A cursor is bound to the filters of the request that produced it: using it with other filters is a `400 validation-failed` at `/query/cursor`.'
    NextCursor:
      type:
        - string
        - 'null'
      minLength: 1
      maxLength: 512
      pattern: ^[A-Za-z0-9_-]+$
      description: Pass it as `cursor` to read the next page; `null` when this was the last page.
    WorkspaceRole:
      type: string
      enum:
        - owner
        - member
    DocumentRole:
      type: string
      enum:
        - viewer
        - commenter
        - editor
        - owner
    GeneralAccess:
      type: string
      enum:
        - none
        - viewer
        - commenter
        - editor
      description: The role every workspace member has on a document without an explicit grant.
    MemberStatus:
      type: string
      enum:
        - pending
        - active
      description: A member added by email is `pending` until that email signs up.
    ThreadStatus:
      type: string
      enum:
        - open
        - resolved
    VersionKind:
      type: string
      enum:
        - auto
        - manual
        - pre-restore
        - restore
    ActivityType:
      type: string
      enum:
        - document.created
        - document.renamed
        - document.moved
        - document.archived
        - document.restored
        - access.granted
        - access.changed
        - access.revoked
        - general-access.changed
        - thread.created
        - thread.replied
        - thread.resolved
        - thread.reopened
        - version.created
        - version.restored
    ErrorCode:
      type: string
      enum:
        - validation-failed
        - not-found
        - forbidden
        - unauthenticated
        - csrf
        - revision-conflict
        - last-owner
        - rate-limited
        - too-large
        - conflict
        - internal-error
        - unavailable
      description: Stable, machine-readable. Clients map it to a message in the person's language; the server never sends translated text.
    FieldErrorCode:
      type: string
      enum:
        - required
        - too-short
        - too-long
        - invalid-format
        - invalid-value
        - unknown-field
    FieldError:
      type: object
      description: One invalid field of a request. Carries a code, never a message.
      additionalProperties: false
      required:
        - pointer
        - code
      properties:
        pointer:
          type: string
          pattern: ^/
          description: A JSON Pointer into the request body (`/title`), or `/query/<name>` or `/path/<name>` for parameters.
        code:
          $ref: '#/components/schemas/FieldErrorCode'
    Problem:
      type: object
      description: An RFC 9457 problem. `errors` lists the invalid fields of a `validation-failed` or `too-large` response.
      additionalProperties: false
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          $ref: '#/components/schemas/ErrorCode'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    DocumentRevisionConflict:
      type: object
      description: 'Returned when `revision` no longer matches: `current` is the document as the server holds it, so the client can reconcile and retry.'
      additionalProperties: false
      required:
        - type
        - title
        - status
        - code
        - current
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          const: 409
        code:
          type: string
          const: revision-conflict
        current:
          $ref: '#/components/schemas/Document'
    FolderRevisionConflict:
      type: object
      description: 'Returned when `revision` no longer matches: `current` is the folder as the server holds it, so the client can reconcile and retry.'
      additionalProperties: false
      required:
        - type
        - title
        - status
        - code
        - current
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          const: 409
        code:
          type: string
          const: revision-conflict
        current:
          $ref: '#/components/schemas/Folder'
    User:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - name
      properties:
        id:
          $ref: '#/components/schemas/Id'
        email:
          $ref: '#/components/schemas/Email'
        name:
          $ref: '#/components/schemas/PersonName'
    UserRef:
      type: object
      description: Enough of a person to label them.
      additionalProperties: false
      required:
        - id
        - name
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          $ref: '#/components/schemas/PersonName'
    Workspace:
      type: object
      description: "`role` is the caller's role in the workspace."
      additionalProperties: false
      required:
        - id
        - name
        - role
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          $ref: '#/components/schemas/WorkspaceName'
        role:
          $ref: '#/components/schemas/WorkspaceRole'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    Member:
      type: object
      description: 'A pending member already has a `userId`: the account created at sign-up keeps it.'
      additionalProperties: false
      required:
        - userId
        - email
        - name
        - role
        - status
        - createdAt
      properties:
        userId:
          $ref: '#/components/schemas/Id'
        email:
          $ref: '#/components/schemas/Email'
        name:
          oneOf:
            - $ref: '#/components/schemas/PersonName'
            - type: 'null'
          description: '`null` while the member is pending.'
        role:
          $ref: '#/components/schemas/WorkspaceRole'
        status:
          $ref: '#/components/schemas/MemberStatus'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    Folder:
      type: object
      additionalProperties: false
      required:
        - id
        - workspaceId
        - name
        - revision
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        workspaceId:
          $ref: '#/components/schemas/Id'
        name:
          $ref: '#/components/schemas/FolderName'
        revision:
          $ref: '#/components/schemas/Revision'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    Document:
      type: object
      description: 'Metadata only: the content is a Yjs document that travels over the collaboration connection, never over REST.'
      additionalProperties: false
      required:
        - id
        - workspaceId
        - folderId
        - title
        - excerpt
        - revision
        - role
        - generalAccess
        - pinned
        - createdBy
        - createdAt
        - updatedAt
        - archivedAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        workspaceId:
          $ref: '#/components/schemas/Id'
        folderId:
          $ref: '#/components/schemas/NullableId'
        title:
          $ref: '#/components/schemas/DocumentTitle'
        excerpt:
          type:
            - string
            - 'null'
          maxLength: 300
          description: The start of the first paragraph, or `null` for an empty document.
        revision:
          $ref: '#/components/schemas/Revision'
        role:
          $ref: '#/components/schemas/DocumentRole'
          description: The caller's effective role on this document.
        generalAccess:
          oneOf:
            - $ref: '#/components/schemas/GeneralAccess'
            - type: 'null'
          description: How the document is shared with the workspace. Only the document's effective owners get it; for everyone else it is `null`, because the matrix keeps the sharing settings to owners.
          x-draftroom-restricted:
            visibleTo:
              - owner
        pinned:
          type: boolean
          description: Whether the caller pinned it.
        createdBy:
          $ref: '#/components/schemas/UserRef'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        archivedAt:
          $ref: '#/components/schemas/NullableTimestamp'
    DocumentRef:
      type: object
      additionalProperties: false
      required:
        - id
        - title
      properties:
