  responses:
    BadRequest:
      description: The request is malformed or breaks a rule of the contract. `errors` says which fields.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            validation-failed:
              value:
                type: /problems/validation-failed
                title: The request is not valid.
                status: 400
                code: validation-failed
                errors:
                  - pointer: /title
                    code: required
    Unauthenticated:
      description: There is no valid session, or the credentials are wrong.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unauthenticated:
              value:
                type: /problems/unauthenticated
                title: Authentication is required.
                status: 401
                code: unauthenticated
    Forbidden:
      description: The caller can see the resource but may not do this (`forbidden`), or the `X-CSRF-Token` header is missing or wrong (`csrf`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            forbidden:
              value:
                type: /problems/forbidden
                title: This role cannot do that.
                status: 403
                code: forbidden
            csrf:
              value:
                type: /problems/csrf
                title: The CSRF token is missing or wrong.
                status: 403
                code: csrf
    NotFound:
      description: There is no such resource, or the caller cannot read it. The two are indistinguishable on purpose.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            not-found:
              value:
                type: /problems/not-found
                title: Not found.
                status: 404
                code: not-found
    Conflict:
      description: The request conflicts with the current state of the resource.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            conflict:
              value:
                type: /problems/conflict
                title: The request conflicts with the current state.
                status: 409
                code: conflict
    LastOwner:
      description: A workspace or a document always keeps at least one owner.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            last-owner:
              value:
                type: /problems/last-owner
                title: The last owner cannot be removed or demoted.
                status: 409
                code: last-owner
    DocumentStale:
      description: The `revision` sent is stale.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/DocumentRevisionConflict'
          examples:
            revision-conflict:
              value:
                type: /problems/revision-conflict
                title: The document changed since it was read.
                status: 409
                code: revision-conflict
                current:
                  id: c4e6a8b0-2d3f-4b5a-9c7e-4a6c8e0b2d44
                  workspaceId: 0b1f6d54-3c1a-4f55-9a43-6a7d2f5e8c01
                  folderId: a3d5c7e9-1b2f-4a6c-8d0e-3f5a7c9e1b33
                  title: Autumn launch plan
                  excerpt: The launch moves to the second week of November so the workshop can run first.
                  revision: 3
                  role: owner
                  generalAccess: none
                  pinned: true
                  createdBy:
                    id: 5b8f7a3e-2d4c-4e1b-8a6f-1c9d3e7b0a11
                    name: Marta Ruiz
                  createdAt: 2026-10-13T14:00:00Z
                  updatedAt: 2026-10-13T15:30:00Z
                  archivedAt: null
    FolderStale:
      description: The `revision` sent is stale.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/FolderRevisionConflict'
          examples:
            revision-conflict:
              value:
                type: /problems/revision-conflict
                title: The folder changed since it was read.
                status: 409
                code: revision-conflict
                current:
                  id: a3d5c7e9-1b2f-4a6c-8d0e-3f5a7c9e1b33
                  workspaceId: 0b1f6d54-3c1a-4f55-9a43-6a7d2f5e8c01
                  name: Launch
                  revision: 2
                  createdAt: 2026-10-13T14:00:00Z
                  updatedAt: 2026-10-13T15:30:00Z
    TooLarge:
      description: A text in the request body is longer than its limit, or the body is bigger than the server accepts. A value below its minimum, and any query or path parameter out of range, is a `400 validation-failed` instead.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            too-large:
              value:
                type: /problems/too-large
                title: A value exceeds its limit.
                status: 413
                code: too-large
                errors:
                  - pointer: /title
                    code: too-long
    RateLimited:
      description: Too many attempts. Retry after the delay in `Retry-After`.
      headers:
        Retry-After:
          description: Seconds to wait.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            rate-limited:
              value:
                type: /problems/rate-limited
                title: Too many requests.
                status: 429
                code: rate-limited
    Unavailable:
      description: The database is unreachable or the migrations are not current.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unavailable:
              value:
                type: /problems/unavailable
                title: The server is not ready.
                status: 503
                code: unavailable
    Unexpected:
      description: Any other failure. Unhandled errors are `internal-error`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            internal-error:
              value:
                type: /problems/internal-error
                title: Something went wrong.
                status: 500
                code: internal-error
