openapi: 3.1.0
info:
  title: Draftroom API
  version: 1.0.0
  summary: The REST API of Draftroom, a collaborative document editor.
  description: |-
    Metadata, permissions, comments, versions and history. Document content is a Yjs document: it travels over the collaboration connection and never over REST.

    Every request after sign-in carries the `dr_session` cookie; requests that change state also carry the `X-CSRF-Token` header. Every error is `application/problem+json` with a stable `code`. Text lengths count Unicode code points.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
    description: The same origin as the app; every path starts with `/api`.
tags:
  - name: Session
    description: Who is signed in, sign-up, sign-in and sign-out.
  - name: Workspaces
    description: The workspaces a person belongs to.
  - name: Members
    description: Who belongs to a workspace, and as what.
  - name: Folders
    description: Flat folders that group documents.
  - name: Documents
    description: 'Document metadata and lifecycle: the content is not served here.'
  - name: Pins and shared
    description: A person's pinned documents and the ones shared with them.
  - name: Access
    description: Who can open a document, and as what.
  - name: Comments
    description: Threads anchored to ranges of a document, and their comments.
  - name: Versions
    description: Checkpoints of a document and restoring one.
  - name: Activity
    description: The workspace history and the history of one document.
  - name: Templates
    description: Built-in starting points for new documents.
  - name: Health
    description: Probes for the process and its dependencies.
paths:
  /api/me:
    get:
      operationId: getMe
      tags:
        - Session
      summary: Get the signed-in person
      description: Any signed-in person.
      responses:
        '200':
          description: The person behind the session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                default:
                  $ref: '#/components/examples/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/Unexpected'
      security:
        - session: []
      x-draftroom-roles:
        scope: session
  /api/auth/sign-up:
    post:
      operationId: signUp
      tags:
        - Session
      summary: Create an account and sign in
      description: |-
        Starts a session: the response sets the `dr_session` cookie and the `dr_csrf` cookie. The account **claims** the pending membership row of this email, if there is one: it keeps the same `userId`, becomes an active member and inherits the document grants given to it. Only an email that already has a signed-up account is a `409 conflict`.

        No sign-in needed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
            examples:
              default:
                value:
                  email: marta@harborpine.example
                  password: correct horse battery staple
                  name: Marta Ruiz
      responses:
        '201':
          description: The account was created and the session started.
          headers:
            Set-Cookie:
              description: Sets `dr_session` (HttpOnly) and `dr_csrf` (readable by the client, echoed in `X-CSRF-Token`).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                default:
                  $ref: '#/components/examples/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Unexpected'
      security: []
      x-draftroom-roles:
        scope: public
  /api/auth/sign-in:
    post:
      operationId: signIn
      tags:
        - Session
      summary: Sign in
      description: |-
        Rotates the session. Wrong email and wrong password get the same `401 unauthenticated`, so the response never says which accounts exist.

        No sign-in needed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
            examples:
              default:
                value:
                  email: marta@harborpine.example
                  password: correct horse battery staple
      responses:
        '200':
          description: The session started.
          headers:
            Set-Cookie:
              description: Sets `dr_session` (HttpOnly) and `dr_csrf` (readable by the client, echoed in `X-CSRF-Token`).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                default:
                  $ref: '#/components/examples/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '413':
          $ref: '#/components/responses/TooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Unexpected'
      security: []
      x-draftroom-roles:
        scope: public
  /api/auth/sign-out:
    post:
      operationId: signOut
      tags:
        - Session
      summary: Sign out
      description: |-
        Ends the session on the server and clears both cookies. Open collaboration connections of the session close.

        Any signed-in person.
      responses:
        '204':
          description: The session ended.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Unexpected'
      security:
        - session: []
          csrf: []
      x-draftroom-roles:
        scope: session
  /api/workspaces:
    get:
      operationId: listWorkspaces
      tags:
        - Workspaces
      summary: List the caller's workspaces
      description: |-
        Ordered by `name`, then `id`, ascending.

        Any signed-in person.
      responses:
        '200':
          description: The workspaces the caller belongs to.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceList'
              examples:
                default:
                  value:
                    items:
                      - id: 0b1f6d54-3c1a-4f55-9a43-6a7d2f5e8c01
                        name: Harbor & Pine
                        role: owner
                        createdAt: 2026-10-13T14:00:00Z
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/Unexpected'
      security:
        - session: []
      x-draftroom-roles:
        scope: session
  /api/workspaces/{workspaceId}:
    get:
      operationId: getWorkspace
      tags:
        - Workspaces
      summary: Get a workspace
      description: 'Required workspace role. Read the workspace, its members, folders and lists: member, owner.'
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: The workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
              examples:
                default:
                  $ref: '#/components/examples/Workspace'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Unexpected'
      security:
        - session: []
      x-draftroom-roles:
        scope: workspace
        rules:
          - row: workspace-read
            roles:
              - member
              - owner
    patch:
      operationId: updateWorkspace
      tags:
        - Workspaces
      summary: Rename a workspace
      description: 'Required workspace role. Rename the workspace: owner.'
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkspaceRequest'
            examples:
              default:
                value:
                  name: Harbor & Pine Studio
      responses:
        '200':
          description: The renamed workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
              examples:
                default:
                  value:
                    id: 0b1f6d54-3c1a-4f55-9a43-6a7d2f5e8c01
                    name: Harbor & Pine Studio
                    role: owner
                    createdAt: 2026-10-13T14:00:00Z
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/TooLarge'
        default:
          $ref: '#/components/responses/Unexpected'
      security:
        - session: []
          csrf: []
      x-draftroom-roles:
        scope: workspace
        rules:
          - row: rename-workspace
            roles:
              - owner
  /api/workspaces/{workspaceId}/members:
    get:
      operationId: listMembers
      tags:
        - Members
      summary: List the members of a workspace
      description: |-
        Includes pending members. Ordered by `createdAt`, then `userId`, ascending.

        Required workspace role. Read the workspace, its members, folders and lists: member, owner.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: The members.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberList'
              examples:
                default:
                  value:
                    items:
                      - userId: 7c2e9d41-6a8b-4f03-b5d7-2e4a8c1f9b22
                        email: daniel@harborpine.example
                        name: Daniel Okafor
                        role: member
                        status: active
                        createdAt: 2026-10-13T14:00:00Z
                      - userId: 2a4c6e8f-1b3d-4f5a-8c7e-9b1d3f5a7c44
                        email: lucia@harborpine.example
                        name: null
                        role: member
                        status: pending
                        createdAt: 2026-10-13T15:30:00Z
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Unexpected'
      security:
        - session: []
      x-draftroom-roles:
        scope: workspace
        rules:
          - row: workspace-read
            roles:
              - member
              - owner
    post:
      operationId: addMember
      tags:
        - Members
      summary: Add a member by email
      description: |-
        The member is `pending` until that email signs up. Adding an email that already belongs to the workspace is a `409 conflict`.

        Required workspace role. Add, change role or remove members: owner.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberRequest'
            examples:
              default:
                value:
                  email: lucia@harborpine.example
                  role: member
      responses:
        '201':
          description: The new member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
              examples:
                default:
                  $ref: '#/components/examples/PendingMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        default:
          $ref: '#/components/responses/Unexpected'
      security:
        - session: []
          csrf: []
      x-draftroom-roles:
        scope: workspace
        rules:
          - row: manage-members
            roles:
              - owner
  /api/workspaces/{workspaceId}/members/{userId}:
    patch:
      operationId: updateMember
      tags:
        - Members
      summary: Change a member's role
      description: |-
        Demoting the last owner is a `409 last-owner`.

        Required workspace role. Add, change role or remove members: owner.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRequest'
            examples:
              default:
                value:
                  role: owner
      responses:
        '200':
          description: The member with the new role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
              examples:
                default:
                  $ref: '#/components/examples/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LastOwner'
        default:
          $ref: '#/components/responses/Unexpected'
      security:
        - session: []
          csrf: []
      x-draftroom-roles:
        scope: workspace
        rules:
          - row: manage-members
            roles:
              - owner
    delete:
      operationId: removeMember
      tags:
        - Members
      summary: Remove a member
      description: |-
        The person loses access to every document of the workspace and their open collaboration connections close. A document always keeps at least one explicit owner grant, so when the person holds the only one of some documents, those grants are transferred to the workspace owner who makes the request (when an owner removes themselves, to the longest-standing remaining owner) and one `access.granted` event is recorded per document; the removal is not blocked. Removing the last owner of the workspace is a `409 last-owner`.

        Required workspace role. Add, change role or remove members: owner.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: The member was removed.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LastOwner'
        default:
          $ref: '#/components/responses/Unexpected'
      security:
        - session: []
          csrf: []
      x-draftroom-roles:
        scope: workspace
        rules:
          - row: manage-members
            roles:
              - owner
  /api/workspaces/{workspaceId}/folders:
    get:
      operationId: listFolders
      tags:
        - Folders
      summary: List the folders of a workspace
      description: |-
        Ordered by `name`, then `id`, ascending.

        Required workspace role. Read the workspace, its members, folders and lists: member, owner.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: The folders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderList'
              examples:
                default:
                  value:
                    items:
                      - id: a3d5c7e9-1b2f-4a6c-8d0e-3f5a7c9e1b33
                        workspaceId: 0b1f6d54-3c1a-4f55-9a43-6a7d2f5e8c01
                        name: Launch
                        revision: 2
                        createdAt: 2026-10-13T14:00:00Z
                        updatedAt: 2026-10-13T15:30:00Z
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Unexpected'
      security:
        - session: []
      x-draftroom-roles:
        scope: workspace
        rules:
          - row: workspace-read
            roles:
              - member
              - owner
    post:
      operationId: createFolder
      tags:
        - Folders
      summary: Create a folder
      description: 'Required workspace role. Create documents and folders: member, owner.'
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFolderRequest'
            examples:
              default:
                value:
                  name: Launch
      responses:
        '201':
          description: The new folder.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
              examples:
                default:
                  $ref: '#/components/examples/Folder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/TooLarge'
        default:
          $ref: '#/components/responses/Unexpected'
      security:
        - session: []
          csrf: []
      x-draftroom-roles:
        scope: workspace
        rules:
          - row: create-content
            roles:
              - member
              - owner
  /api/folders/{folderId}:
    patch:
      operationId: updateFolder
      tags:
        - Folders
      summary: Rename a folder
      description: |-
        A stale `revision` is a `409 revision-conflict` carrying the current folder.

        Required workspace role. Rename folders: member, owner.
      parameters:
        - $ref: '#/components/parameters/FolderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFolderRequest'
            examples:
              default:
                value:
                  name: Launch 2026
                  revision: 2
      responses:
        '200':
          description: The renamed folder.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
              examples:
                default:
                  $ref: '#/components/examples/Folder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/FolderStale'
        '413':
          $ref: '#/components/responses/TooLarge'
        default:
          $ref: '#/components/responses/Unexpected'
      security:
        - session: []
          csrf: []
      x-draftroom-roles:
        scope: workspace
        rules:
          - row: rename-folder
            roles:
              - member
              - owner
    delete:
      operationId: deleteFolder
      tags:
        - Folders
      summary: Delete an empty folder
      description: |-
        Only workspace owners: they can read every document, so they can always empty a folder first. A folder that still holds documents, archived ones included, is a `409 conflict`.

        Required workspace role. Delete folders: owner.
      parameters:
        - $ref: '#/components/parameters/FolderId'
      responses:
        '204':
          description: The folder was deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Unexpected'
      security:
        - session: []
          csrf: []
      x-draftroom-roles:
        scope: workspace
        rules:
          - row: delete-folder
            roles:
              - owner
  /api/workspaces/{workspaceId}/documents:
    get:
      operationId: listDocuments
      tags:
        - Documents
      summary: List and search documents
      description: |-
        Only documents the caller can read. With `archived=true`, the archived documents the caller owns. Ordered by `updatedAt` descending, then `id` descending.

        Required workspace role. Read the workspace, its members, folders and lists: member, owner.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: query
          in: query
          required: false
          description: Matches the title and the excerpt.
          schema:
            type: string
            minLength: 1
            maxLength: 200
          example: launch
        - name: folderId
          in: query
          required: false
          description: Only the documents of this folder. A folder that is unknown, or belongs to another workspace, is a `400 validation-failed` at `/query/folderId`.
          schema:
            $ref: '#/components/schemas/Id'
        - name: archived
          in: query
          required: false
          description: List archived documents instead of live ones.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: A page of documents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentPage'
              examples:
                default:
                  value:
                    items:
                      - id: c4e6a8b0-2d3f-4b5a-9c7e-4a6c8e0b2d44
                        workspaceId: 0b1f6d54-3c1a-4f55-9a43-6a7d2f5e8c01
                        folderId: a3d5c7e9-1b2f-4a6c-8d0e-3f5a7c9e1b33
                        title: Autumn launch plan
                        excerpt: The launch moves to the second week of November so the workshop can run first.
                        revision: 3
                        role: owner
                        generalAccess: none
                        pinned: true
                        createdBy:
                          id: 5b8f7a3e-2d4c-4e1b-8a6f-1c9d3e7b0a11
                          name: Marta Ruiz
                        createdAt: 2026-10-13T14:00:00Z
                        updatedAt: 2026-10-13T15:30:00Z
                        archivedAt: null
                    nextCursor: eyJ0IjoiMjAyNi0xMC0xM1QxNTozMDowMFoiLCJpIjoiYzRlNmE4YjAifQ
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Unexpected'
      security:
        - session: []
      x-draftroom-roles:
        scope: workspace
        rules:
          - row: workspace-read
            roles:
              - member
              - owner
    post:
      operationId: createDocument
      tags:
        - Documents
      summary: Create a document
      description: |-
        The caller gets an explicit `owner` grant and `generalAccess` starts at `none`. With `templateId`, the document starts with that template's content in `locale` (`en` when omitted); `locale` without `templateId` is a `400 validation-failed` with `{ pointer: /templateId, code: required }`, the entry a validator gives for a missing dependency. A `folderId` that is unknown, or belongs to another workspace, is a `400 validation-failed` with `invalid-value` at `/folderId`; a `templateId` that is unknown is the same `400` at `/templateId`. Templates are global, so only the folder can belong to another workspace.

        Required workspace role. Create documents and folders: member, owner.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentRequest'
            examples:
              default:
                value:
                  title: Notas de la reunión de otoño
                  folderId: a3d5c7e9-1b2f-4a6c-8d0e-3f5a7c9e1b33
                  templateId: meeting-notes
                  locale: es
      responses:
        '201':
          description: The new document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
              examples:
                default:
                  $ref: '#/components/examples/Document'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/TooLarge'
        default:
          $ref: '#/components/responses/Unexpected'
      security:
        - session: []
          csrf: []
      x-draftroom-roles:
        scope: workspace
        rules:
          - row: create-content
            roles:
              - member
              - owner
  /api/documents/{documentId}:
    get:
      operationId: getDocument
      tags:
        - Documents
      summary: Get a document's metadata
      description: |-
        A document the caller cannot read is a `404 not-found`, identical to a missing one. An archived document is readable only by its owners.

        Required document role. Read metadata and content: viewer, commenter, editor, owner.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: The document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
              examples:
                default:
                  $ref: '#/components/examples/Document'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
