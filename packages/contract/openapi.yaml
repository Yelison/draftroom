        - end
      properties:
        start:
          type: string
          pattern: ^[A-Za-z0-9+/]+={0,2}$
          maxLength: 128
          description: Base64 `Y.encodeRelativePosition` with `assoc = 0`.
        end:
          type: string
          pattern: ^[A-Za-z0-9+/]+={0,2}$
          maxLength: 128
          description: Base64 `Y.encodeRelativePosition` with `assoc = -1`.
