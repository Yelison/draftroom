  /api/versions/{versionId}/restore:
    post:
      operationId: restoreVersion
      tags:
        - Versions
      summary: Restore a version
      description: |-
        Saves a `pre-restore` version of the current state, replaces the live content in one transaction and saves a `restore` version. Edits made meanwhile merge on top. An edit that was already on its way when the restore applied is lost only if it lands inside a node the restore removed; the `pre-restore` version keeps everything applied before that.

        A `409 conflict` means people kept editing the document while it was being restored, so the content that would have been replaced kept changing; nothing was restored and no `pre-restore` version was kept. The same request can be tried again.

        Required document role. Restore a version: owner.
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200':
          description: The `restore` version the operation created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
              examples:
                default:
                  value:
                    id: 08c0e2f4-6b7d-4f9e-9abc-8e0a2c4f6b88
                    documentId: c4e6a8b0-2d3f-4b5a-9c7e-4a6c8e0b2d44
                    kind: restore
                    label: null
                    createdBy:
                      id: 5b8f7a3e-2d4c-4e1b-8a6f-1c9d3e7b0a11
                      name: Marta Ruiz
                    createdAt: 2026-10-13T15:30:00Z
                    sizeBytes: 2048
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Unexpected'
      security:
        - session: []
          csrf: []
      x-draftroom-roles:
        scope: document
        rules:
          - row: restore-version
            roles:
              - owner
