version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Tiptap and Hocuspocus are pinned to exact versions that must move together
      # (@tiptap/react peers @tiptap/core exactly), so a major is a planned migration.
      - dependency-name: '@tiptap/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@hocuspocus/*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
